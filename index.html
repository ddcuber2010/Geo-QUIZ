<style>
/* Layout: full-height map with a result/progress panel beside it (below on phones). Look: surveyor's chart, sage land on pale sea, orange pin vs green truth. */
:root{
  --bg:#eef2f0; --panel:#ffffff; --ink:#12201c; --muted:#58695f; --line:#d3dcd7;
  --sea:#cfe1ea; --land:#e8eee3; --border:#8fa89b; --label:#4b5f55;
  --guess:#e4572e; --truth:#0b7a4b; --ring:#e4572e;
  --b0:#cfd8d3; --b1:#f2b25c; --b2:#7fb7d6; --b3:#0b7a4b;
  --river:#4f93c4; --lake:#b4d6ec;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1513; --panel:#141f1c; --ink:#e6efeb; --muted:#93a79e; --line:#27362f;
  --sea:#10242c; --land:#1e2d27; --border:#40574c; --label:#a9bdb3;
  --guess:#ff7a4d; --truth:#3ddc97; --ring:#ff7a4d;
  --river:#6fb2e0; --lake:#2c5d78;
  --b0:#33433c; --b1:#d69a3f; --b2:#4f95b9; --b3:#3ddc97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1513; --panel:#141f1c; --ink:#e6efeb; --muted:#93a79e; --line:#27362f;
  --sea:#10242c; --land:#1e2d27; --border:#40574c; --label:#a9bdb3;
  --guess:#ff7a4d; --truth:#3ddc97; --ring:#ff7a4d;
  --river:#6fb2e0; --lake:#2c5d78;
  --b0:#33433c; --b1:#d69a3f; --b2:#4f95b9; --b3:#3ddc97; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;height:100%;min-height:0}
.mapwrap{position:relative;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
.panel{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto;padding-right:2px}
h1{margin:0;font-size:28px;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.1}
.sub{color:var(--muted);margin:2px 0 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;font-weight:600}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--guess);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.primary:disabled{opacity:.35;cursor:not-allowed}
button.ghost{background:transparent}
select{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 10px}
.chip{padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat{display:flex;gap:10px;align-items:baseline}
.big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--b0);margin-top:10px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
.grid{display:flex;flex-wrap:wrap;gap:5px}
.el{font-size:12.5px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);font-weight:600;display:flex;gap:6px;align-items:center}
.el::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--b0))}
.el:disabled{opacity:.5;cursor:not-allowed}
.catname{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 5px}
.res .km{font-family:var(--mono);font-size:26px;font-weight:600}
.res .pts{font-family:var(--mono);color:var(--muted)}
.res .near{color:var(--muted);font-size:14px;margin-top:8px}
.verdict{font-weight:800;font-stretch:112%;font-size:20px}
.verdict.hit{color:var(--truth)}.verdict.miss{color:var(--guess)}
.list{margin:6px 0 0;padding:0;list-style:none;font-size:14px}
.list li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.list li span:last-child{font-family:var(--mono)}
/* map overlays */
.ask{position:absolute;left:12px;top:12px;max-width:calc(100% - 90px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.ask small{display:block;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700}
.ask b{font-size:26px;font-weight:800;font-stretch:112%;line-height:1.15;overflow-wrap:anywhere}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;padding:0;font-size:20px;line-height:1}
.confirm{position:absolute;left:12px;bottom:12px;right:12px;display:flex;justify-content:center;pointer-events:none}
.confirm button{pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.2);padding:12px 26px;font-size:16px}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pill{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);white-space:nowrap}
svg.relief{--truth:#ffe14d;--guess:#ff5a36;--river:#9fd8ff;--lake:#7cc0f2}
svg.relief .land{fill:transparent;stroke:rgba(255,255,255,.7)}
svg.relief text{stroke:rgba(4,16,12,.85)}
svg.relief .clabel{fill:#fff}
.elev{position:absolute;left:10px;bottom:10px;width:170px;padding:6px 8px 4px;border-radius:8px;background:color-mix(in srgb,var(--bg) 82%,transparent);font-size:10px;color:var(--ink);display:none;flex-wrap:wrap;justify-content:space-between;pointer-events:none;z-index:3}
.elev.on{display:flex}.elev i{display:block;width:100%;height:9px;border-radius:3px;margin-bottom:3px}
.rv{fill:none;stroke:var(--river);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round;opacity:.9}
.lk{fill:var(--lake);stroke:none;opacity:.9}
.zoom .tog{width:auto;height:auto;padding:6px 8px;font-size:12px;line-height:1.2}
.zoom .tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
svg text{font-family:var(--font);font-weight:700;paint-order:stroke;stroke:var(--sea);stroke-linejoin:round}
@media (max-width:820px){
  body{padding-block:8px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:50vh auto;height:auto}
  .mapwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
  .panel{overflow:visible}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const kmv=(a,b)=>{const m=(a[0]+b[0])/2*Math.PI/180;return[(b[1]-a[1])*111.32*Math.cos(m),(b[0]-a[0])*110.57];};
const kmd=(a,b)=>{const v=kmv(a,b);return Math.hypot(v[0],v[1]);};
// distance from point q to element e; returns {d, at:[lat,lon], idx}
function distTo(e,q){
  if(e.pts.length===1)return{d:kmd(q,e.pts[0]),at:e.pts[0],idx:0};
  let best={d:1e9};
  for(let i=0;i<e.pts.length-1;i++){
    const a=e.pts[i],b=e.pts[i+1],ab=kmv(a,b),aq=kmv(a,q);
    const L2=ab[0]*ab[0]+ab[1]*ab[1]||1e-9;
    let t=Math.max(0,Math.min(1,(aq[0]*ab[0]+aq[1]*ab[1])/L2));
    const at=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
    const d=kmd(q,at);
    if(d<best.d)best={d,at,idx:i+t};
  }
  return best;
}
const WIND=['N','NE','E','SE','S','SW','W','NW'];
function compass(from,to){const v=kmv(from,to);const a=(Math.atan2(v[0],v[1])*180/Math.PI+360)%360;return WIND[Math.round(a/45)%8];}
function nearby(e,anchor){
  if(e.cat==='reka'){
    for(const rad of [22,40,70]){
      const hits=ELEMS.filter(o=>o.cat!=='reka').map(o=>({o,r:distTo(e,o.pts[0])})).filter(x=>x.r.d<=rad);
      if(hits.length){
        const fuzzy=rad>22;
        hits.sort(fuzzy?(a,b)=>a.r.d-b.r.d:(a,b)=>a.r.idx-b.r.idx);
        return{kind:'river',fuzzy,items:hits.slice(0,fuzzy?4:7).map(x=>fuzzy?`${nm(x.o)} (${Math.round(x.r.d)} km)`:nm(x.o))};
      }
    }
  }
  const a=e.cat==='reka'?e.pts[Math.floor(e.pts.length/2)]:e.pts[0];
  const others=ELEMS.filter(o=>o!==e&&o.cat!=='reka').map(o=>({o,d:kmd(a,o.pts[0])})).sort((x,y)=>x.d-y.d).slice(0,3);
  return{kind:e.cat==='reka'?'mid':'point',items:others.map(x=>`${nm(x.o)} (${Math.round(x.d)} km ${compass(a,x.o.pts[0])})`)};
}

if(!prog.layers)prog.layers={relief:true,rivers:true};
let sel=new Set(Object.keys(CATS)), roundLen=10;

const rand=n=>Math.floor(Math.random()*n);

// ---------- map ----------
const svg=document.getElementById('map'), wrap=document.getElementById('mapwrap');
const NS='http://www.w3.org/2000/svg';
const mk=(tag,attrs={},parent)=>{const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;};
mk('rect',{x:-2000,y:-2000,width:6000,height:6000,fill:'var(--sea)'},svg);
const imgEl=mk('image',{x:DX0,y:DY0,width:DW,height:DH,preserveAspectRatio:'none'},svg);imgEl.setAttribute('href',RELIEF);
const gLand=mk('g',{},svg);
for(const [n,d] of LAND)mk('path',{d,class:'land',fill:'var(--land)',stroke:'var(--border)','stroke-width':1,'vector-effect':'non-scaling-stroke','stroke-linejoin':'round'},gLand);
const lkEl=mk('path',{d:LAKES,class:'lk','pointer-events':'none'},svg);
const rvEl=mk('path',{d:RIVERS,class:'rv','vector-effect':'non-scaling-stroke','pointer-events':'none'},svg);
const gLab=mk('g',{'pointer-events':'none'},svg);
const labels=COUNTRY_LABELS.map(([n,la,lo])=>{const [x,y]=xy(la,lo);return mk('text',{x,y,class:'clabel','text-anchor':'middle',fill:'var(--label)','font-size':11,opacity:.9,'stroke-width':3},gLab).appendChild(document.createTextNode(tr(n))),gLab.lastChild;});
function relabel(){COUNTRY_LABELS.forEach((c,i)=>{labels[i].textContent=tr(c[0]);});}
const gOver=mk('g',{'pointer-events':'none'},svg);
let view={cx:MAPW/2,cy:MAPH/2,w:MAPW+40};
let rect=wrap.getBoundingClientRect();
function viewBox(){
  rect=svg.getBoundingClientRect();
  const w=view.w,h=w*rect.height/rect.width;
  return{x:view.cx-w/2,y:view.cy-h/2,w,h};
}
function maxW(){const r=svg.getBoundingClientRect();const asp=r.width&&r.height?r.width/r.height:1.3;return Math.min(DW,DH*asp);}
function clampView(){
  const mw=maxW(),r=svg.getBoundingClientRect(),asp=r.width&&r.height?r.width/r.height:1.3;
  view.w=Math.max(70,Math.min(mw,view.w));const h=view.w/asp;
  view.cx=Math.max(DX0+view.w/2,Math.min(DX0+DW-view.w/2,view.cx));view.cy=Math.max(DY0+h/2,Math.min(DY0+DH-h/2,view.cy));
}
let marks=[]; // redraw callbacks that depend on scale
function applyView(){
  clampView();
  const vb=viewBox();
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const upp=vb.w/rect.width;
  labels.forEach(t=>{t.setAttribute('font-size',11*upp);t.setAttribute('stroke-width',3*upp);});
  marks.forEach(f=>f(upp));
}
function fitAll(){cancelAnimationFrame(anim);const r=svg.getBoundingClientRect();const asp=r.width&&r.height?r.width/r.height:1.3;
  const cx=(20.9-L0)*K,cy=(B1-44.15)*100,needW=(24.2-17.8)*K,needH=(46.6-41.8)*100;
  view={cx,cy,w:Math.max(needW,needH*asp)};applyView();}
function fitPts(pts,minW=300){
  const xs=pts.map(p=>xy(p[0],p[1])[0]),ys=pts.map(p=>xy(p[0],p[1])[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const r=svg.getBoundingClientRect();
  const w=Math.max((x1-x0)*1.5,(y1-y0)*1.5*r.width/r.height,minW);
  animateTo({cx:(x0+x1)/2,cy:(y0+y1)/2,w});
}
let anim=0;
function animateTo(t){
  cancelAnimationFrame(anim);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){view=t;applyView();return;}
  const s={...view},t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/380),e=1-Math.pow(1-k,3);
    view={cx:s.cx+(t.cx-s.cx)*e,cy:s.cy+(t.cy-s.cy)*e,w:s.w+(t.w-s.w)*e};applyView();if(k<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
const zoomAt=(f,px,py)=>{ // px,py: svg coords to keep fixed
  const nw=Math.max(70,Math.min(maxW(),view.w*f)),k=nw/view.w;
  view.cx=px-(px-view.cx)*k;view.cy=py-(py-view.cy)*k;view.w=nw;applyView();};
const toSvg=(cx,cy)=>{const vb=viewBox();return[vb.x+(cx-rect.left)*vb.w/rect.width,vb.y+(cy-rect.top)*vb.w/rect.width];};
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const[p,q]=toSvg(e.clientX,e.clientY);zoomAt(Math.pow(1.0016,e.deltaY),p,q);},{passive:false});
const ptrs=new Map();let drag=null,pinch=null,moved=false;
svg.addEventListener('pointerdown',e=>{
  svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});cancelAnimationFrame(anim);
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,cx:view.cx,cy:view.cy};moved=false;}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),w:view.w};moved=true;}
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    const mid=toSvg((a.x+b.x)/2,(a.y+b.y)/2);const nw=pinch.w*pinch.d/d;zoomAt(nw/view.w,mid[0],mid[1]);return;}
  if(drag&&ptrs.size===1){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(dx,dy)>6){moved=true;svg.classList.add('dragging');}
    if(moved){const upp=view.w/rect.width;view.cx=drag.cx-dx*upp;view.cy=drag.cy-dy*upp;applyView();}}
});
const endPtr=e=>{
  const wasClick=drag&&!moved&&ptrs.size===1;
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){svg.classList.remove('dragging');drag=null;if(wasClick&&e.type==='pointerup')onMapClick(e);}
};
svg.addEventListener('pointerup',endPtr);svg.addEventListener('pointercancel',endPtr);
document.getElementById('zin').onclick=()=>{zoomAt(1/1.5,view.cx,view.cy)};
document.getElementById('zout').onclick=()=>{zoomAt(1.5,view.cx,view.cy)};
document.getElementById('zfit').onclick=fitAll;
function setLayers(){document.getElementById('elev').classList.toggle('on',!!prog.layers.relief);svg.classList.toggle('relief',!!prog.layers.relief);imgEl.style.display=prog.layers.relief?'':'none';rvEl.style.display=prog.layers.rivers?'':'none';lkEl.style.display=prog.layers.rivers?'':'none';
  document.querySelectorAll('.tog').forEach(b=>b.setAttribute('aria-pressed',String(!!prog.layers[b.dataset.l])));}

// ---------- overlay drawing ----------
const clearOver=()=>{gOver.replaceChildren();marks=[];};
function dot(parent,lat,lon,{fill,stroke='#fff',r=7,ring=false,label,labelFill}={}){
  const [x,y]=xy(lat,lon);
  const c=mk('circle',{cx:x,cy:y,fill:ring?'none':fill,stroke:ring?fill:stroke,'stroke-width':ring?3:2,'vector-effect':'non-scaling-stroke'},parent);
  let t=null;
  if(label){t=mk('text',{x,y,'text-anchor':'start',fill:labelFill||'var(--ink)'},parent);t.textContent=label;}
  marks.push(upp=>{c.setAttribute('r',r*upp);if(t){t.setAttribute('font-size',13*upp);t.setAttribute('x',x+(r+4)*upp);t.setAttribute('y',y+4*upp);t.setAttribute('stroke-width',3.5*upp);}});
  return c;
}
function line(parent,pts,{stroke,w=3,dash,opacity=1}){
  const d='M'+pts.map(p=>xy(p[0],p[1]).map(v=>v.toFixed(1)).join(' ')).join('L');
  return mk('path',{d,fill:'none',stroke,'stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke','stroke-dasharray':dash||'none',opacity},parent);
}
function drawTruth(e,labelIt=true){
  if(e.cat==='reka'){
    line(gOver,e.pts,{stroke:'var(--truth)',w:4});
    const mid=e.pts[Math.floor(e.pts.length/2)];
    const [x,y]=xy(mid[0],mid[1]);const t=mk('text',{x,y,fill:'var(--truth)','text-anchor':'middle'},gOver);t.textContent=nm(e);
    marks.push(upp=>{t.setAttribute('font-size',14*upp);t.setAttribute('stroke-width',4*upp);t.setAttribute('y',y-9*upp);});
  } else dot(gOver,e.pts[0][0],e.pts[0][1],{fill:'var(--truth)',r:7,label:labelIt?nm(e):null,labelFill:'var(--truth)'});
}
function drawHintRing(e){
  const a=e.pts.length>1?e.pts[Math.floor(e.pts.length/2)]:e.pts[0];
  const off=round.hintOff;const c=[a[0]+off[0],a[1]+off[1]];
  const [x,y]=xy(c[0],c[1]);const rKm=170;
  const circ=mk('circle',{cx:x,cy:y,r:rKm/110.57*100,fill:'var(--ring)','fill-opacity':.08,stroke:'var(--ring)','stroke-width':2,'stroke-dasharray':'6 5','vector-effect':'non-scaling-stroke'},gOver);
}

// ---------- game ----------
const catOrder=Object.keys(CATS);
function pool(){return ELEMS.filter(e=>sel.has(e.cat));}
function weight(e){return[3,4,2,0.5][boxOf(e.id)];}
function pickQueue(ids,n){
  const items=ids.map(id=>BYID[id]);const out=[];
  while(out.length<n&&items.length){
    const tot=items.reduce((s,e)=>s+weight(e),0);let r=Math.random()*tot,i=0;
    for(;i<items.length;i++){r-=weight(items[i]);if(r<=0)break;}
    out.push(items.splice(Math.min(i,items.length-1),1)[0].id);
  }
  return out;
}
function startRound(ids){
  const p=ids||pickQueue(pool().map(e=>e.id),roundLen);
  if(!p.length)return;
  round={queue:p,i:0,total:0,results:[],pending:null,hint:false,hintOff:[0,0],state:'ask'};
  studyId=null;nextQ();
}
function nextQ(){
  clearOver();
  if(round.i>=round.queue.length){round.state='end';prog.rounds++;prog.best=Math.max(prog.best,round.total);save();fitAll();render();return;}
  round.state='ask';round.pending=null;round.hint=false;
  const e=BYID[round.queue[round.i]];
  const ang=Math.random()*Math.PI*2,rr=60/110*Math.random()+0.25;
  round.hintOff=[Math.sin(ang)*rr,Math.cos(ang)*rr*1.3];
  render();
}
const cur=()=>BYID[round.queue[round.i]];
function onMapClick(ev){
  if(!round||round.state!=='ask')return;
  const [x,y]=toSvg(ev.clientX,ev.clientY);
  round.pending=ll(x,y);
  drawAsk();
}
function drawAsk(){
  clearOver();
  const e=cur();
  if(round.hint)drawHintRing(e);
  if(round.pending)dot(gOver,round.pending[0],round.pending[1],{fill:'var(--guess)',r:8});
  applyView();
  document.getElementById('confirmWrap').hidden=!round.pending;
}
function confirmGuess(){
  if(!round||round.state!=='ask'||!round.pending)return;
  const e=cur(),g=round.pending,r=distTo(e,g);
  const d=r.d,pts=Math.round(5000*Math.exp(-d/100)*(round.hint?0.6:1));
  const hit=d<=HIT[e.cat];
  round.total+=pts;round.results.push({id:e.id,d,pts,hit,hint:round.hint,g,at:r.at});
  prog.box[e.id]=hit&&!round.hint?Math.min(3,boxOf(e.id)+1):(hit?boxOf(e.id):1);
  save();round.state='reveal';
  clearOver();
  if(e.cat==='reka'){drawTruth(e);}else drawTruth(e);
  line(gOver,[g,r.at],{stroke:'var(--guess)',w:2.5,dash:'7 6'});
  dot(gOver,g[0],g[1],{fill:'var(--guess)',r:8});
  if(e.cat==='reka')dot(gOver,r.at[0],r.at[1],{fill:'var(--truth)',r:4});
  const pts2=e.cat==='reka'?[...e.pts,g]:[e.pts[0],g];
  fitPts(pts2,320);
  document.getElementById('confirmWrap').hidden=true;
  render();
}
function nextStep(){if(round.state==='reveal'){round.i++;nextQ();}}
function skip(){ // counts as a miss, shows the answer
  if(!round||round.state!=='ask')return;
  const e=cur();round.results.push({id:e.id,d:null,pts:0,hit:false,skipped:true});prog.box[e.id]=1;save();
  round.state='reveal';clearOver();drawTruth(e);
  fitPts(e.pts,320);
  document.getElementById('confirmWrap').hidden=true;render();
}
function showStudy(id){
  if(round&&round.state==='ask')return;
  studyId=id;const e=BYID[id];clearOver();drawTruth(e);fitPts(e.pts,320);render();
}
document.getElementById('confirm').onclick=confirmGuess;
addEventListener('keydown',e=>{
  if(e.key==='Enter'){ if(round&&round.state==='ask'&&round.pending)confirmGuess(); else if(round&&round.state==='reveal')nextStep(); }
});

// ---------- panel rendering ----------
const panel=document.getElementById('panel');
const $=(h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BC=['var(--b0)','var(--b1)','var(--b2)','var(--b3)'];
function stats(){const c=[0,0,0,0];ELEMS.forEach(e=>c[boxOf(e.id)]++);return c;}
function header(){
  return `<div class="topbar"><div><h1>Gde je to?</h1><p class="sub">${ELEMS.length} places from your list</p></div>
  <div class="row"><button class="chip" id="scr" title="Switch between Cyrillic and Latin names">${script==='cyr'?'Ћир':'Lat'}</button>${round&&round.state!=='end'?`<div class="pill">${round.i+(round.state==='reveal'?1:0)}/${round.queue.length} &middot; ${round.total.toLocaleString('en')} pts</div>`:''}</div></div>`;
}
function nearHTML(e){
  const n=nearby(e);
  if(n.kind==='river'&&n.items.length)return `<div class="near"><b>${n.fuzzy?'Runs near:':'Flows past:'}</b> ${n.items.map(esc).join(n.fuzzy?', ':' &rarr; ')}</div>`;
  return `<div class="near"><b>Closest places:</b> ${n.items.map(esc).join(', ')}</div>`;
}
function libraryHTML(disabled){
  let h='';

    const list=ELEMS.filter(e=>e.cat===c);
    h+=`<div class="catname">${CATS[c]} &middot; ${list.length}</div><div class="grid">`+
      list.map(e=>`<button class="el" data-id="${e.id}" style="--c:${BC[boxOf(e.id)]}" ${disabled?'disabled':''}>${esc(nm(e))}</button>`).join('')+`</div>`;
  }
  return h;
}
function render(){
  const ask=document.getElementById('ask');
  let h=header();
  if(round&&round.state==='ask'){
    const e=cur();ask.hidden=false;document.getElementById('askCat').textContent=CATS[e.cat];document.getElementById('askName').textContent=nm(e);
    h+=`<div class="card"><h2>Question ${round.i+1}</h2><p style="margin:0 0 10px">Click the map where you think <b>${esc(nm(e))}</b> is${e.cat==='reka'?' (click anywhere on its course)':''}, then confirm.</p>
      <div class="row"><button id="hint" class="ghost" ${round.hint?'disabled':''}>${round.hint?'Hint on (&minus;40%)':'Hint (&minus;40%)'}</button><button id="skip" class="ghost">Skip</button><button id="quit" class="ghost">End round</button></div></div>`;
    h+=`<div class="card"><h2>Tips</h2><p class="sub" style="margin:0">Scroll or pinch to zoom, drag to pan. Enter confirms. Your pin turns the place green after 3 correct answers in a row.</p></div>`;
  } else if(round&&round.state==='reveal'){
    const e=cur(),r=round.results[round.results.length-1];ask.hidden=true;
    const verdict=r.skipped?`<div class="verdict miss">Skipped</div>`:r.hit?`<div class="verdict hit">Got it</div>`:`<div class="verdict miss">Not quite</div>`;
    h+=`<div class="card res"><h2>${esc(nm(e))}</h2>${verdict}
      ${r.skipped?'':`<div class="km">${r.d<10?r.d.toFixed(1):Math.round(r.d)} km</div><div class="pts">+${r.pts.toLocaleString('en')} pts${r.hint?' (hint used)':''}</div>
      <div class="near">${r.hit?'Within':'Needed within'} ${HIT[e.cat]} km. Your pin was ${compass(r.at,r.g)} of the target.</div>`}
      ${nearHTML(e)}
      <div class="row" style="margin-top:14px"><button class="primary" id="next">${round.i+1>=round.queue.length?'See results':'Next'}</button></div></div>`;
  } else if(round&&round.state==='end'){
    ask.hidden=true;
    const hits=round.results.filter(r=>r.hit).length,max=round.queue.length*5000;
    const missed=round.results.filter(r=>!r.hit).map(r=>r.id);
    h+=`<div class="card res"><h2>Round complete</h2><div class="big">${round.total.toLocaleString('en')}</div><div class="pts">of ${max.toLocaleString('en')} &middot; ${hits}/${round.queue.length} located &middot; best ${prog.best.toLocaleString('en')}</div>
      <ul class="list">${round.results.map(r=>`<li><span>${r.hit?'&#10003;':'&#10007;'} ${esc(nm(BYID[r.id]))}</span><span>${r.d==null?'skipped':(r.d<10?r.d.toFixed(1):Math.round(r.d))+' km'}</span></li>`).join('')}</ul>
      <div class="row" style="margin-top:14px"><button class="primary" id="again">New round</button>${missed.length?`<button id="retry">Retry ${missed.length} missed</button>`:''}<button class="ghost" id="home">Menu</button></div></div>`;
  } else {
    ask.hidden=true;
    const c=stats(),n=ELEMS.length;
    h+=`<div class="card"><h2>Progress</h2><div class="stat"><span class="big">${c[3]}</span><span class="sub">of ${n} locked in</span></div>
      <div class="bar">${c.map((v,i)=>`<i style="width:${v/n*100}%;background:${BC[i]}"></i>`).reverse().join('')}</div>
      <div class="legend"><span style="--c:${BC[3]}">locked in ${c[3]}</span><span style="--c:${BC[2]}">getting there ${c[2]}</span><span style="--c:${BC[1]}">missed ${c[1]}</span><span style="--c:${BC[0]}">new ${c[0]}</span></div></div>
    <div class="card"><h2>New round</h2>
      <div class="row" style="margin-bottom:12px">${catOrder.map(k=>`<button class="chip" data-cat="${k}" aria-pressed="${sel.has(k)}">${CATS[k]}</button>`).join('')}</div>
      <div class="row"><select id="len" aria-label="Round length"><option value="10">10 questions</option><option value="20">20 questions</option><option value="999">All places</option></select>
      <button class="primary" id="start" ${pool().length?'':'disabled'}>Start (${Math.min(roundLen,pool().length)})</button></div>
      <p class="sub" style="margin:10px 0 0;font-size:13px">Places you miss come back more often.</p></div>`;
    if(studyId){const e=BYID[studyId];h+=`<div class="card res"><h2>${esc(nm(e))} &middot; ${CATS[e.cat]}</h2>${nearHTML(e)}</div>`;}
    h+=`<div class="card"><h2>All ${n} places</h2><p class="sub" style="margin:0">Tap a name to see where it is. Colors show how well you know it.</p>${libraryHTML(false)}</div>`;
    if(prog.rounds||c[0]<n)h+=`<div class="row"><button class="ghost" id="reset">Reset progress</button></div>`;
  }
  panel.replaceChildren(...$(`<div style="display:contents">${h}</div>`).childNodes);
  wire();
}
function wire(){
  const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f;};
  on('start',()=>startRound());
  on('scr',()=>{script=script==='cyr'?'lat':'cyr';prog.script=script;save();relabel();if(round&&round.state==='ask'){}else if(round&&round.state==='reveal'){clearOver();const e=cur();drawTruth(e);const r=round.results[round.results.length-1];if(!r.skipped){line(gOver,[r.g,r.at],{stroke:'var(--guess)',w:2.5,dash:'7 6'});dot(gOver,r.g[0],r.g[1],{fill:'var(--guess)',r:8});}applyView();}else if(studyId){clearOver();drawTruth(BYID[studyId]);applyView();}render();});
  on('next',nextStep);on('skip',skip);
  on('quit',()=>{round=null;clearOver();fitAll();document.getElementById('confirmWrap').hidden=true;render();});
  on('home',()=>{round=null;clearOver();fitAll();render();});
  on('again',()=>startRound());
  on('retry',()=>startRound(round.results.filter(r=>!r.hit).map(r=>r.id)));
  on('hint',()=>{round.hint=true;drawAsk();render();});
  let confirmReset=false;
  on('reset',function(){ if(!confirmReset){confirmReset=true;this.textContent='Tap again to erase progress';return;} prog={box:{},best:0,rounds:0};save();studyId=null;clearOver();render(); });
  const len=document.getElementById('len');if(len){len.value=String(roundLen);len.onchange=()=>{roundLen=+len.value;render();};}
  panel.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const k=b.dataset.cat;sel.has(k)?sel.delete(k):sel.add(k);render();});
  panel.querySelectorAll('.el').forEach(b=>b.onclick=()=>showStudy(b.dataset.id));
}
fitAll();render();
requestAnimationFrame(fitAll);
</script>
